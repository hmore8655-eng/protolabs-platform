name: ProtoLabs CI

on:
  push:
    branches:
      - main
      - feature/protolabs-industrial-redesign
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npx oxlint src
      - name: Check backend JavaScript syntax
        run: node --check server/index.cjs && node --check server/services/auth.cjs && node --check server/db.cjs
      - name: Build frontend
        run: npm run build
